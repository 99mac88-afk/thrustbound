name: Thrustbound
options:
  bundleIdPrefix: com.thrustbound
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
targets:
  Thrustbound:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Thrustbound
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thrustbound.game
        PRODUCT_NAME: Thrustbound
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: NO
        CODE_SIGN_STYLE: Automatic
  ThrustboundTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ThrustboundTests
    dependencies:
      - target: Thrustbound
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thrustbound.game.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Thrustbound.app/Thrustbound"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Thrustbound:
    build:
      targets:
        Thrustbound: all
        ThrustboundTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ThrustboundTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
